[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedger"
version = "0.1.0"
description = "Kedger — local-first engineering memory and sealed handoff CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Kedger contributors" }]
dependencies = [
  "click>=8.1",
  "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
kedger = "kedger.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kedger"]

[tool.hatch.build.targets.wheel.sources]
"src/kedger" = "kedger"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
