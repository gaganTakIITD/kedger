[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedger"
version = "0.1.0"
description = "Kedger — local-first engineering memory and sealed handoff CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Kedger contributors" }]
keywords = ["memory", "cli", "agents", "handoff", "sealed-packs", "cursor", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "pynacl>=1.5",
]

[project.urls]
Homepage = "https://github.com/gaganTakIITD/kedger"
Repository = "https://github.com/gaganTakIITD/kedger"
Issues = "https://github.com/gaganTakIITD/kedger/issues"
Documentation = "https://github.com/gaganTakIITD/kedger/blob/main/docs/OPEN_SOURCE_MEMORY_ARCHITECTURE.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
kedger = "kedger.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kedger"]

[tool.hatch.build.targets.wheel.sources]
"src/kedger" = "kedger"

[tool.hatch.build.targets.wheel.force-include]
"hooks" = "kedger/hook_packs"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/hooks",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/eval"]
