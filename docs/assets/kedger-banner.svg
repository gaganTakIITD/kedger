<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-label="Kedger — local memory CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#132738" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="420" fill="url(#bg)"/>
  <rect width="1440" height="420" fill="url(#grid)"/>
  <rect width="1440" height="52" fill="#0a1622"/>
  <line x1="0" y1="52" x2="1440" y2="52" stroke="#5eead4" stroke-width="2"/>
  <text x="24" y="34" fill="#5eead4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="4">KEDGER</text>
  <text x="1140" y="34" fill="#7dd3c7" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">LOCAL MEMORY CLI</text>
  <text x="72" y="190" fill="#e8fffb" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="92" font-weight="700" letter-spacing="12">KEDGER</text>
  <text x="72" y="250" fill="#9fb8c4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" letter-spacing="2">HOOKS ? ANCHORS ? SEALED .KXP</text>
  <rect x="72" y="300" width="14" height="30" fill="#5eead4">
    <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>
  <text x="98" y="324" fill="#5eead4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24">kedger init --name alice</text>
  <text x="72" y="380" fill="#5a7a88" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">OSS ENG-MEMORY CLI · KEDGER.MEMORY.V1</text>
</svg>
