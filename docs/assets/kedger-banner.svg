<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-label="Kedger  local memory CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="55%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#0d1f2d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a3344" stroke-width="1" opacity="0.55"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="420" fill="url(#bg)"/>
  <rect width="1440" height="420" fill="url(#grid)"/>
  <rect x="0" y="0" width="1440" height="120" fill="url(#glow)"/>
  <text x="72" y="78" fill="#7dd3c7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" letter-spacing="6">LOCAL MEMORY CLI</text>
  <text x="72" y="200" fill="#e8fffb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="96" font-weight="700" letter-spacing="10">KEDGER</text>
  <text x="72" y="268" fill="#9fb8c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28">hooks ’ anchors ’ sealed .kxp handoff</text>
  <rect x="72" y="310" width="14" height="28" fill="#5eead4">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="98" y="334" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26">kedger init --name alice</text>
</svg>
